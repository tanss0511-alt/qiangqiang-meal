const $=id=>document.getElementById(id);let opened=false,done=false,index=0;const lines=[['手机先放一放，饭要好好吃。','我的强强宝宝，要把自己照顾好哦。'],['肚子不许空着，想我可以留着。','先吃饱，等会儿再慢慢想我。'],['今天也要按时投喂可爱的你。','好好吃饭，是今天的小任务。'],['你负责吃饱，我负责想你。','饭后记得喝点水，别总是忙着。'],['给你夹一口菜，再偷偷加一点爱。','隔着屏幕，也想陪你吃这一顿。'],['工作可以等一下，你的胃不可以。','就这一会儿，安心吃顿饭吧。']];
function hearts(){for(let i=0;i<14;i++){const e=document.createElement('span');e.className='heart';e.textContent=['🧡','💛','♡'][i%3];e.style.left=(25+Math.random()*50)+'vw';e.style.top=(45+Math.random()*30)+'vh';e.style.setProperty('--dx',(Math.random()*160-80)+'px');document.body.append(e);setTimeout(()=>e.remove(),1600)}}
function speak(){const a=$('voice');a.currentTime=0;const p=a.play();if(p)p.catch(()=>{$('sound').hidden=false;$('sound').textContent='点这里听语音提醒 🔊'})}
function openMeal(){if(opened)return;opened=true;$('scene').classList.add('opened');$('lid').disabled=true;$('title').innerHTML='强强宝宝，<br>开饭啦！';$('intro').innerHTML='你的专属饭点提醒已送达。<br>再忙，也要记得照顾自己。';$('hint').textContent='今日配料：一碗饭 + 满满的喜欢';$('tag').textContent='来自想你的人';$('message').textContent='再忙也要好好吃饭哦。';$('note').textContent='吃饱了，再来想我。';$('open').hidden=true;$('eat').hidden=false;$('again').hidden=false;$('sound').hidden=false;speak();hearts()}
$('lid').onclick=openMeal;$('open').onclick=openMeal;$('sound').onclick=speak;$('again').onclick=()=>{const line=lines[index++%lines.length];$('message').textContent=line[0];$('note').textContent=line[1];hearts()};$('eat').onclick=()=>{if(done)return;done=true;$('tag').textContent='饭点小任务 · 已签收';$('message').textContent='乖，奖励你一个隔空抱抱！';$('note').textContent='强强宝宝，爱你哦。今天也要吃得开心。';$('eat').textContent='去吃饭吧，我的宝贝 🧡';$('eat').disabled=true;$('voice').pause();hearts()};document.addEventListener('visibilitychange',()=>{if(document.hidden)$('voice').pause()});
</script></body></html>
