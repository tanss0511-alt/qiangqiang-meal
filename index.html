function hearts(){for(let i=0;i<14;i++){const e=document.createElement('span');e.className='heart';e.textContent=['🧡','💛','♡'][i%3];e.style.left=(25+Math.random()*50)+'vw';e.style.top=(45+Math.random()*30)+'vh';e.style.setProperty('--dx',(Math.random()*160-80)+'px');document.body.append(e);setTimeout(()=>e.remove(),1600)}}

function openMeal(){if(opened)return;opened=true;$('scene').classList.add('opened');$('lid').disabled=true;$('title').innerHTML='强强宝宝，<br>开饭啦！';$('intro').innerHTML='你的专属饭点提醒已送达。<br>再忙，也要记得照顾自己。';pickFood();$('tag').textContent='来自想你的人';$('message').textContent='再忙也要好好吃饭哦。';$('note').textContent='吃饱了，再来想我。';$('open').hidden=true;$('eat').hidden=false;$('again').hidden=false;$('sound').hidden=false;$('reroll').hidden=false;speak();hearts()}
