<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花在日常｜姐姐的有声翻页相册</title><meta name="description" content="姐姐的阳台与手作插花"><link rel="preload" as="image" href="media/page-01.jpg"><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;padding:12px;background:#f5f1e9;color:#294236;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;--foreground:#294236}main{max-width:900px;margin:auto}.viz-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.btn{font:inherit;font-size:14px;padding:12px 14px;border:1px solid #d5d9cf;border-radius:10px;background:#fffdf8;color:#294236;cursor:pointer}.btn-primary{background:#294236;color:#fffdf8}.btn:disabled{opacity:.4}.page-label{font-size:14px}button:focus-visible{outline:2px solid #ae7655;outline-offset:3px}</style></head><body><main><div id="sister-flower-book">
  <div class="book-stage" aria-label="花在日常翻页相册">
    <div class="paper-book"></div>
    <div class="single-book"><img alt="画册封面" draggable="false"></div>
  </div>
  <div class="viz-controls">
    <button type="button" class="btn" data-action="prev" aria-label="往前翻页">← 上一页</button>
    <span class="page-label tabular-nums" aria-live="polite"></span>
    <button type="button" class="btn btn-primary" data-action="next" aria-label="往后翻页">下一页 →</button>
    <button type="button" class="btn btn-ghost" data-action="home">回封面</button>
  </div>
</div>
<style>
#sister-flower-book .book-stage{padding:24px 6px 28px;overflow:hidden;perspective:1700px;touch-action:pan-y;user-select:none}
#sister-flower-book .paper-book{position:relative;width:100%;max-width:700px;aspect-ratio:296/210;margin:auto;transform-style:preserve-3d;transition:translate 1.5s cubic-bezier(.4,0,.2,1);translate:-25% 0}
#sister-flower-book .sheet{position:absolute;left:50%;top:0;width:50%;height:100%;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.5s cubic-bezier(.4,0,.2,1)}
#sister-flower-book .sheet.turned{transform:rotateY(-180deg)}
#sister-flower-book .face{background:#F4F0E7;position:absolute;inset:0;backface-visibility:hidden;box-shadow:0 8px 22px color-mix(in srgb,var(--foreground) 17%,transparent)}
#sister-flower-book .face.back{transform:rotateY(180deg)}
#sister-flower-book .face img,#sister-flower-book .single-book img{width:100%;height:100%;display:block;object-fit:contain}
#sister-flower-book .face:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--foreground) 15%,transparent),transparent 6%,transparent 97%,color-mix(in srgb,var(--foreground) 5%,transparent))}
#sister-flower-book .back:after{transform:scaleX(-1)}
#sister-flower-book .single-book{display:none;width:100%;max-width:420px;aspect-ratio:148/210;margin:auto;transform-origin:left center;box-shadow:0 8px 25px color-mix(in srgb,var(--foreground) 20%,transparent)}
#sister-flower-book .viz-controls{justify-content:center}
#sister-flower-book .page-label{min-width:72px;text-align:center}
#sister-flower-book.mobile .paper-book{display:none}
#sister-flower-book.mobile .single-book{display:block}
@media(prefers-reduced-motion:reduce){#sister-flower-book .sheet,#sister-flower-book .paper-book{transition:none}}
</style>
<script>
(()=>{
const root=document.getElementById('sister-flower-book');
const pages=["media/page-01.jpg", "media/page-02.jpg", "media/page-03.jpg", "media/page-04.jpg", "media/page-05.jpg", "media/page-06.jpg", "media/page-07.jpg", "media/page-08.jpg", "media/page-09.jpg", "media/page-10.jpg", "media/page-11.jpg", "media/page-12.jpg"]; const total=pages.length,leafCount=total/2;
const book=root.querySelector('.paper-book'),single=root.querySelector('.single-book'),label=root.querySelector('.page-label');
const prev=root.querySelector('[data-action="prev"]'),next=root.querySelector('[data-action="next"]');
const names=["封面 · 花在日常", "白雪轻纱", "胭脂来信", "云朵糖", "一方阳台，满室欢喜", "细看花瓣", "蜜桃云笺", "一瓶云与雪", "把春天留在家", "云朵有颜色", "玫瑰特写", "封底"];
let pos=0,mobile=false,busy=false;
const sheets=[];
for(let i=0;i<leafCount;i++){
 const sheet=document.createElement('div');sheet.className='sheet';
 for(let j=0;j<2;j++){
 const face=document.createElement('div');face.className='face '+(j?'back':'front');
 const image=document.createElement('img');image.dataset.page=i*2+j;if(i*2+j<2)image.src=pages[i*2+j];image.decoding='async';image.alt=names[i*2+j];image.draggable=false;face.append(image);sheet.append(face);
 }
 book.append(sheet);sheets.push(sheet);
}
function spread(){return pos===0?0:Math.ceil(pos/2)}
function draw(){
 root.querySelectorAll('img[data-page]').forEach(img=>{const n=Number(img.dataset.page);if(Math.abs(n-pos)<=3&&!img.getAttribute('src'))img.src=pages[n];});
 const k=spread();
 book.style.translate=k===0?'-25% 0':k===leafCount?'25% 0':'0 0';
 sheets.forEach((s,i)=>{s.classList.toggle('turned',i<k);s.style.zIndex=i<k?i+1:total-i;});
 single.querySelector('img').src=pages[pos];single.querySelector('img').alt=names[pos];
 label.textContent=mobile?`${pos+1} / ${total}`:k===0?'封面':k===leafCount?'封底':`${k*2}–${k*2+1} / ${total}`;
 prev.disabled=pos===0;next.disabled=pos===total-1;
}
function save(){window.openai?.setWidgetState?.({modelContent:{album:'花在日常',page:pos+1},privateContent:{page:pos}})?.catch(()=>{});}
function move(dir){
 if(busy)return;let target=mobile?pos+dir:dir>0?Math.min(total-1,spread()*2+1):Math.max(0,(spread()-1)*2-1);
 target=Math.max(0,Math.min(total-1,target));if(target===pos)return;
 root.dispatchEvent(new Event('album-page-turn'));const old=spread();pos=target;busy=true;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(mobile&&!reduced){
  const a=single.animate([{transform:'rotateY(0deg)'},{transform:`rotateY(${dir>0?-85:85}deg)`}],{duration:650,easing:'ease-in'});
  a.onfinish=()=>{draw();single.animate([{transform:`rotateY(${dir>0?85:-85}deg)`},{transform:'rotateY(0deg)'}],{duration:800,easing:'ease-out'}).onfinish=()=>busy=false;};
 }else{
  draw();if(!mobile&&!reduced){const moving=sheets[dir>0?old:old-1];if(moving)moving.style.zIndex=20;setTimeout(()=>{draw();busy=false},1540);}else busy=false;
 }
 save();
}
prev.onclick=()=>move(-1);next.onclick=()=>move(1);
root.querySelector('[data-action="home"]').onclick=()=>{if(busy||pos===0)return;root.dispatchEvent(new Event('album-page-turn'));pos=0;draw();save();};
root.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});
let sx=0,sy=0;
root.querySelector('.book-stage').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
root.querySelector('.book-stage').addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))move(dx<0?1:-1);else if(Math.abs(dx)<6&&Math.abs(dy)<6){const r=e.currentTarget.getBoundingClientRect();move(e.clientX-r.left>r.width/2?1:-1)}});
function restore(state){const n=state?.privateContent?.page;if(Number.isInteger(n)&&n>=0&&n<total){pos=n;draw()}}
new ResizeObserver(()=>{mobile=root.clientWidth<540;root.classList.toggle('mobile',mobile);draw()}).observe(root);
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));draw();
})();
</script>
