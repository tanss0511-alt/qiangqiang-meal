<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ee"><title>姐姐的阳台花事｜图片与花花表情</title><meta name="description" content="把生活照顾好，花会替你说话。姐姐的花园纪念图与聊天GIF，点开即可保存。"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#35483a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header,main,footer{max-width:960px;margin:auto;padding:24px 20px}header{padding-top:38px}.eyebrow{font-size:12px;letter-spacing:3px;color:#7b8776}h1{font-family:serif;font-size:34px;letter-spacing:3px;font-weight:500;margin:16px 0}header p{font-size:14px;line-height:1.9;color:#788172}.hero{height:180px;width:100%;object-fit:cover;object-position:50% 42%;border-radius:18px;margin:12px 0}.tabs{flex-wrap:wrap;display:flex;gap:8px;background:#e7ebdf;padding:5px;border-radius:14px}.tabs button{flex:1;padding:13px 6px;border:0;border-radius:10px;color:#50654d;background:transparent}.tabs button[aria-selected=true]{background:#39583e;color:white}.intro{font-size:13px;color:#788172;margin:0 0 20px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid #e3e6d9;border-radius:16px;overflow:hidden;padding:0;background:white;text-align:left;color:inherit}.card img{width:100%;height:auto;aspect-ratio:3/4;object-fit:contain;display:block}.card.gif img{aspect-ratio:1}.caption{padding:13px}.caption strong{font-size:16px;font-weight:500;display:block}.caption small{display:block;color:#85907f;font-size:11px;margin-top:6px}footer{text-align:center;font-size:12px;line-height:2;color:#8b9484;padding-bottom:40px}dialog{border:0;border-radius:20px;width:min(94vw,540px);padding:16px;background:#fff;max-height:94dvh;color:#35483a}dialog::backdrop{background:#172b21bb}dialog img{display:block;width:100%;max-height:62dvh;object-fit:contain;touch-action:pan-y}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top h2{font-size:18px;margin:0}.close{border:0;background:#edf0e8;border-radius:50%;width:36px;height:36px;font-size:25px;color:#35483a}.actions{display:flex;gap:8px;margin-top:12px}.actions a{flex:1;text-align:center;background:#39583e;color:white;text-decoration:none;border-radius:10px;padding:13px 6px;font-size:14px}.actions a:last-child{background:#edf0e8;color:#39583e}.help{font-size:12px;color:#75816f;line-height:1.8;margin:12px 0 0}.pager{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.pager button{border:0;border-radius:8px;padding:8px 13px;background:#edf0e8;color:#39583e}details{margin-top:24px;font-size:13px;line-height:1.9;color:#788172}summary{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #d4a2aa;outline-offset:3px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{height:240px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><header><div class="eyebrow">一方阳台 · 四季欢喜</div><h1>姐姐的阳台花事</h1><p>把生活照顾好，花会替你说话。<br>收藏花开的样子，也把花花送进聊天里。</p><img class="hero" src="assets/photo-04.jpg" alt="姐姐的阳台花园"><p><a href="album/?v=20261024-peach" style="display:inline-block;padding:13px 20px;background:#39583e;color:white;border-radius:12px;text-decoration:none">翻开《花在日常》相册 →</a></p><div class="tabs" role="tablist" aria-label="内容分类"><button role="tab" aria-selected="false" data-tab="arrangements">手作插花 · 3张</button><button role="tab" aria-selected="true" data-tab="photos">阳台花园 · 4张</button><button role="tab" aria-selected="false" data-tab="gifs">聊天表情 · 10款</button></div></header><main><p class="intro" id="intro"></p><div class="grid" id="grid"></div><details><summary>微信里怎么保存？</summary><p>点开一张图片或表情，长按大图，使用微信显示的保存选项。GIF请保存原文件，截图不会动。</p><p>如果长按没有保存选项，点“打开原图”，或通过微信右上角菜单在浏览器中打开后下载。不同手机的菜单名称可能不同。</p></details></main><footer>姐姐用心养花，也用巧手把花插进日常。<br>原照片经 AI 辅助排版与设计 · 小名不是品种名</footer><dialog id="viewer"><div class="top"><h2 id="title"></h2><button class="close" id="close" aria-label="关闭">×</button></div><img id="large" alt=""><div class="pager"><button id="prev">← 上一张</button><span id="count"></span><button id="next">下一张 →</button></div><div class="actions"><a id="original" target="_blank" rel="noopener">打开原图</a><a id="save" download>下载保存</a></div><p class="help" id="hint"></p></dialog><script>
const groups={arrangements:['蜜桃云笺','一瓶云与雪','把春天留在家'],photos:['白雪轻纱','胭脂来信','云朵糖','一方阳台，满室欢喜'],gifs:['早安呀','送你花花','谢谢你呀','心花怒放','歇一会儿','晚安好梦','送你一束好心情','谢谢你的惦记','今天也美美的','愿你好梦']};let tab='arrangements',index=0,focus;const $=s=>document.querySelector(s),modal=$('#viewer');
function path(i,preview=false){return 'assets/'+(tab==='arrangements'?'arr-':tab==='photos'?'photo-':'gif-')+String(i+1).padStart(2,'0')+'.'+(tab!=='gifs'||preview?'jpg':'gif')}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));$('#intro').textContent=tab==='arrangements'?'姐姐亲手插的花 · 3张花艺纪念图，点开保存':tab==='photos'?'4张花园纪念图 · 点开看大图，长按保存':'10款循环GIF · 新增4款插花表情，点开播放';$('#grid').replaceChildren();groups[tab].forEach((name,i)=>{const b=document.createElement('button');b.className='card '+(tab==='gifs'?'gif':'');b.setAttribute('aria-label','查看'+name);const img=document.createElement('img');img.src=path(i,true);img.alt=name;img.loading='lazy';const c=document.createElement('div');c.className='caption';const s=document.createElement('strong');s.textContent=name;const sm=document.createElement('small');sm.textContent=tab==='gifs'?'GIF动图 · 点开播放':'高清JPG · 点开保存';c.append(s,sm);b.append(img,c);b.onclick=()=>{focus=b;index=i;update();modal.showModal()};$('#grid').append(b)})}
function update(){const name=groups[tab][index];$('#title').textContent=name;$('#large').src=path(index);$('#large').alt=name;$('#original').href=path(index);$('#save').href=path(index);$('#save').download=name+(tab==='gifs'?'.gif':'.jpg');$('#count').textContent=(index+1)+' / '+groups[tab].length;$('#hint').textContent=tab==='gifs'?'长按这张动图保存；不要截图，截图就不会动啦。':'长按大图保存，或点“下载保存”。'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#close').onclick=()=>modal.close();modal.addEventListener('close',()=>focus?.focus());$('#prev').onclick=()=>{index=(index+groups[tab].length-1)%groups[tab].length;update()};$('#next').onclick=()=>{index=(index+1)%groups[tab].length;update()};document.addEventListener('keydown',e=>{if(!modal.open)return;if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});render();
</script></body></html>
