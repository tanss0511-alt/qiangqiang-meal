<style>*{box-sizing:border-box}body{margin:0;background:#193b32;color:#f8efdd;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:660px;margin:auto;padding:18px 18px 24px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;margin-bottom:14px}a{color:inherit}button{font:inherit;cursor:pointer;border:1px solid #e8ddbe55;color:inherit;background:transparent;border-radius:30px;padding:11px 20px;min-height:44px}button:disabled{opacity:.3}button:focus-visible,a:focus-visible{outline:3px solid #edb442;outline-offset:3px}.stage{perspective:1800px;position:relative}.page{background:#f8f0dd;color:#233a30;border-radius:3px 12px 12px 3px;box-shadow:6px 6px 0 #ddd1b8,10px 10px 0 #b3aa95,14px 16px 30px #0004;padding:23px 22px 18px;min-height:650px;transform-origin:left;position:relative;touch-action:pan-y}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0002,transparent 3%)}.kicker{color:#a14032;font-size:11px;letter-spacing:2px;border-bottom:1px solid #bdb59e;padding-bottom:12px}h1{font-family:"Songti SC",serif;font-size:clamp(27px,6.5vw,40px);line-height:1.25;margin:18px 0 12px;letter-spacing:1px}.photos{height:350px;display:flex;gap:8px;background:#e9e3d5;padding:7px}.photos img{display:block;min-width:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in}.photos.two img{width:calc(50% - 4px)}.dialogue{font-size:17px;line-height:1.8;white-space:pre-line;margin:17px 0 12px;font-weight:600}.footer{font-size:11px;line-height:1.6;color:#7a7565;display:flex;justify-content:space-between;gap:12px}.stamp{display:inline-block;border:2px solid #a14032;border-radius:4px;color:#a14032;transform:rotate(-5deg);padding:5px 8px;margin-top:10px;font-size:12px;letter-spacing:2px}.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:28px}.controls span{font-size:12px}.hint{text-align:center;font-size:11px;color:#c3cfbc;line-height:1.9;margin const pages=[["花花队长｜正式出道", "小烟花，大场面", [4830], "本来只想种点花，结果种出了自己的颁奖现场。", "强强宝宝主演 · 花朵友情抢镜"], ["第一回｜花界开会", "谁批准你这么红的？", [4831, 4832], "花：报告队长，低调过了，没忍住。", "本页红得很有自己的想法"], ["第二回｜场面失控", "说好的小烟花呢？", [4833, 4834], "小烟花：名字是小时候取的，请尊重我现在的规模。", "长大这件事，它是认真的"], ["第三回｜主角登场", "传说中的幕后大佬", [4835, 4836], "别人出场带保镖，强强出场带一整棵花。", "阵仗很大 · 本人很忙"], ["第四回｜园艺大片", "浇水都像在拍大片", [4837, 4838], "导演：来点气势。\n强强：先让一下，我这边还没浇到。", "没有特效，全靠认真"], ["第五回｜花抢镜了", "请问哪位才是男主角？", [4839, 4840], "强强：我是。\n花：你确定？镜头再往上挪一点。", "最佳抢镜奖 · 当场颁发"], ["第六回｜巡园日常", "这片花，归他管", [4841, 4842], "别人的江湖刀光剑影，他的江湖花枝招展。", "今日武器：耐心与水"], ["第七回｜大佬转身", "背影也要排练？", [4843, 4844], "花：队长，回头！\n强强：又怎么了？\n花：没事，想给你加点戏。", "花多了，意见也多了"], ["第八回｜反客为主", "人呢？花说它包场了", [4845, 4846], "摄影师找男主，男主在花后。\n花：不好意思，今天我走大女主路线。", "请从花缝中寻找强强宝宝"], ["第九回｜花界宣言", "不是滤镜，是实力", [4847, 4848], "花：今天不营业。\n路人：那你开这么好看？\n花：这是基本礼貌。", "一本正经地漂亮"], ["第十回｜隔壁也开了", "这边也不打算低调", [4849, 4850], "粉花：红花演完了吧？\n轮到我们了，灯光师请就位。", "花园没有配角"], ["片尾｜特别鸣谢", "你负责养花，我负责夸你", [4830], "颁给强强宝宝：\n「把日子过得有花样」终身荣誉队长。", "花开得很好，种花的人更值得喜欢。"]];const $=id=>document.getElementById(id);let current=0,busy=false,startX=0,startY=0;const img=n=>'media/IMG_'+n+'.jpg';
function draw(){let [chapter,title,photos,words,foot]=pages[current];$('page').innerHTML='<div class="kicker">'+chapter+'</div><h1>'+title+'</h1><div class="photos '+(photos.length>1?'two':'')+'">'+photos.map((n,i)=>'<img src="'+img(n)+'" alt="强强的花园照片 '+n+'" decoding="async" '+(current===0?'fetchpriority="high"':'')+'>').join('')+'</div><p class="dialogue">'+words+'</p>'+(current===0?'<span class="stamp">本片含大量花戏</span>':'')+'<div class="footer"><span>'+foot+'</span><span>'+String(current+1).padStart(2,'0')+'</span></div>';$('counter').textContent=(current+1)+' / '+pages.length;$('prev').disabled=current===0;$('next').textContent=current===pages.length-1?'再看一遍 ↻':current===0?'翻开看看 →':'下一页 →';$('chapters').value=current;document.querySelectorAll('.photos img').forEach(el=>el.onclick=()=>{$('large').src=el.src;$('viewer').showModal()});history.replaceState(null,'','#page-'+(current+1));if(current+1<pages.length)setTimeout(()=>pages[current+1][2].forEach(n=>{let p=new Image();p.src=img(n)}),1200)}
async function turn(n){if(busy||n<0||n>=pages.length||n===current)return;busy=true;let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;$('page').classList.add('turnout');await new Promise(r=>setTimeout(r,reduce?0:550));current=n;draw();$('page').classList.remove('turnout');$('page').classList.add('turnin');await new Promise(r=>setTimeout(r,reduce?0:650));$('page').classList.remove('turnin');busy=false}
$('next').onclick=()=>turn((current+1)%pages.length);$('prev').onclick=()=>turn(current-1);pages.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+' · '+p[0];$('chapters').append(o)});$('chapters').onchange=e=>turn(+e.target.value);$('close').onclick=()=>$('viewer').close();$('page').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});$('page').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)turn(current+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if($('viewer').open)return;if(e.key==='ArrowRight')turn(current+1);if(e.key==='ArrowLeft')turn(current-1)});$('share').onclick=async()=>{let url=location.href.split('#')[0];if(navigator.share){try{await navigator.share({title:document.title,text:'强强宝宝主演，花朵们负责抢戏。',url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);$('status').textContent='链接已复制，可以发到微信啦。'}catch{prompt('复制相册链接',url)}};let initial=Number(location.hash.replace('#page-',''))-1;if(initial>=0&&initial<pages.length)current=initial;draw();
</script></html>
