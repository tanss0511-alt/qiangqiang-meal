<header><span class="tag">把喜欢，存进每一张照片</span><h1>我们的照片库</h1><p class="desc">从山海间的合照，到果园、花草和钓鱼的时光。<br>把拍过的普通一天，慢慢收成我们的相册。</p><div class="stats"><div><strong id="total">114</strong><small>张照片</small></div><div><strong>4</strong><small>个主题</small></div><div><strong>∞</strong><small>份喜欢</small></div></div></header>
<div class="album-head" id="albumHead" hidden><button id="backAlbums">‹ 相册</button><h2 id="albumTitle"></h2></div>
<section class="controls" id="controls" aria-label="查找照片" hidden><div class="searchrow"><input id="search" type="search" placeholder="在这个相册里搜索" aria-label="搜索照片"><span id="count" aria-live="polite">载入中</span></div></section>
<main id="content" aria-live="polite"></main><button id="more" class="more" hidden>再看一些照片 ↓</button><button id="retry" hidden>照片没载入，点我重试</button>
<p class="note">点击照片可放大、前后翻看，打开 JPG 可保存到手机。照片保持原画面和比例，未作 AI 重绘；部分早期照片为旧网页留存版。时间按已知经历或整理批次标注，未确认的拍摄日期不作推断。原始文件仍保留在本地，下载的是清晰 JPG 展示版。</p><p class="ending">有些照片拍的是风景，<br>我想收藏的，却是和你一起的日子。</p>
</div><dialog id="viewer"><div class="top"><h2 id="title"></h2><button id="close" aria-label="关闭照片">×</button></div><img id="photo" alt=""><div class="row"><button id="prev" aria-label="上一张照片">← 上一张</button><span id="position"></span><button id="next" aria-label="下一张照片">下一张 →</button></div><p id="quality"></p><div class="actions"><a id="original" href="" target="_blank" rel="noopener">打开清晰 JPG ↗</a><a id="download" href="" download>下载这张照片 ↓</a></div><p class="tip">微信中可长按图片保存；没有保存入口时，从右上角选择浏览器打开。</p></dialog>
<script src="photos-data.js?v=20261014-albums"></script>
<script>
const groups={earlier:['早期合照','9月上传 · 拍摄日期未确认'],holiday:['国庆小日子','10月初 · 国庆假期'],garden:['强强的小花园','10月4日整理'],fishing:['钓鱼时光','10月6日—7日']};
let photos=[],group=null,query='',limit=24,current='',lastFocus;
const $=s=>document.querySelector(s),viewer=$('#viewer');
function selected(){return photos.filter(p=>(group==='all'||p.group===group)&&p.name.toLowerCase().includes(query.toLowerCase()))}
function render(){
const home=group===null;document.body.classList.toggle('in-album',!home);$('#controls').hidden=home;$('#albumHead').hidden=home;
if(home){$('#content').replaceChildren();const grid=document.createElement('div');grid.className='album-grid';for(const [key,info] of Object.entries(groups)){const items=photos.filter(p=>p.group===key);if(!items.length)continue;const b=document.createElement('button');b.className='album-card';b.setAttribute('aria-label',info[0]+'，'+items.length+'张照片');const img=document.createElement('img');img.src=(key==='holiday'?items.find(p=>p.id==='p018'):items[0]).thumb;img.alt=info[0];const title=document.createElement('strong');title.textContent=info[0];const sub=document.createElement('small');sub.textContent=items.length+' 张 · '+info[1];b.append(img,title,sub);b.onclick=()=>{group=key;query='';$('#search').value='';limit=24;render();window.scrollTo(0,0)};grid.append(b)}$('#content').append(grid);$('#more').hidden=true;return;}
$('#albumTitle').textContent=groups[group][0];const list=selected(),shown=list.slice(0,limit);$('#count').textContent=list.length+' 张';$('#content').replaceChildren();for(const [key,info] of Object.entries(groups)){const a=shown.filter(p=>p.group===key);if(!a.length)continue;const h=document.createElement('h2');h.className='chapter';h.textContent=info[0];const sub=document.createElement('small');sub.textContent=info[1];h.append(sub);const grid=document.createElement('div');grid.className='grid';for(const p of a){const b=document.createElement('button');b.className='card';b.setAttribute('aria-label','查看照片：'+p.name);const img=document.createElement('img');img.src=p.thumb;img.alt=p.name;img.loading='lazy';const name=document.createElement('strong');name.textContent=p.name;const sm=document.createElement('small');sm.textContent=p.width+' × '+p.height;b.append(img,name,sm);b.onclick=()=>openPhoto(p.id);grid.append(b)}$('#content').append(h,grid)}if(!list.length){const d=document.createElement('p');d.className='empty';d.textContent='没有找到这张照片，换个词试试。';$('#content').append(d)}$('#more').hidden=shown.length>=list.length;}
function updatePhoto(){const p=photos.find(p=>p.id===current),list=selected();$('#title').textContent=p.name;$('#photo').src=p.src;$('#photo').alt=p.name;$('#quality').textContent=p.quality+' · '+p.width+' × '+p.height;$('#position').textContent=(list.findIndex(p=>p.id===current)+1)+' / '+list.length;$('#original').href=p.src;$('#download').href=p.src;$('#download').download=p.name+'.jpg';history.replaceState(null,'','#'+p.id)}
function openPhoto(id){current=id;lastFocus=document.activeElement;updatePhoto();viewer.showModal();document.body.style.overflow='hidden'}
function step(n){const a=selected(),i=a.findIndex(p=>p.id===current);current=a[(i+n+a.length)%a.length].id;updatePhoto()}
$('#close').onclick=()=>viewer.close();viewer.addEventListener('close',()=>{document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search);lastFocus?.focus()});$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(viewer.open&&e.key==='ArrowLeft')step(-1);if(viewer.open&&e.key==='ArrowRight')step(1)});
let touchX=0;$('#photo').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});$('#photo').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>70)step(dx<0?1:-1)},{passive:true});
$('#backAlbums').onclick=()=>{group=null;query='';$('#search').value='';render();window.scrollTo(0,0)};$('#search').oninput=e=>{query=e.target.value;limit=24;render()};$('#more').onclick=()=>{limit+=24;render()};
function load(){try{$('#retry').hidden=true;photos=window.ALBUM_PHOTOS;if(!Array.isArray(photos))throw Error('photos');$('#total').textContent=photos.length;const id=location.hash.slice(1),p=photos.find(p=>p.id===id);if(p)group=p.group;render();if(p)openPhoto(id)}catch(e){$('#retry').hidden=false;$('#content').textContent='照片暂时未载入，请重试。'}}$('#retry').onclick=()=>location.reload();load();
</script></body></html>
