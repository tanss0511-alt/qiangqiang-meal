<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf4ee"><title>给强强宝宝的一点偏爱 💌</title><style>
*{box-sizing:border-box}body{margin:0;color:#643c43;background:#fbf4ee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100svh;background-image:radial-gradient(#c8a3a52b .8px,transparent .8px);background-size:12px 12px}main{max-width:460px;margin:auto;padding:40px 24px 30px;text-align:center}.eyebrow{font-size:11px;letter-spacing:4px;color:#ae7a82}.seal{display:grid;place-items:center;width:56px;height:56px;background:#f2dce0;color:#bd6274;border:1px solid #e6c4cb;border-radius:50%;margin:23px auto 16px;font-size:30px;transform:rotate(-12deg)}h1{font-family:"Songti SC","STSong",serif;font-size:34px;line-height:1.45;font-weight:600;margin:0 0 12px;letter-spacing:2px}.sub{font-size:14px;color:#a07e80;line-height:1.8;margin:0}.ticket{position:relative;background:#fffdf9;margin:30px 0 22px;padding:22px 20px;border:1px solid #ead5d5;border-radius:20px;box-shadow:0 15px 40px #76454a12;transform:rotate(-1deg)}.topline{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a68285;letter-spacing:1px;margin-bottom:20px}.to{font-weight:600;color:#8a535c;font-size:13px;letter-spacing:0}.field{position:relative;height:260px;overflow:hidden;border-radius:13px;background:#fff3ee;border:1px solid #f2dad4;isolation:isolate;touch-action:none}.inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 17px}.little{font-size:29px;margin-bottom:12px}.quote{font-family:"Songti SC","STSong",serif;font-weight:600;font-size:23px;line-height:1.75;margin:0;white-space:pre-line}.sign{font-size:12px;color:#b38588;margin-top:15px;letter-spacing:2px}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:crosshair;transition:opacity .55s}.revealed canvas{opacity:0;pointer-events:none}.divider{height:1px;border-top:1px dashed #e8cdd1;margin:22px -20px 16px;position:relative}.divider:before,.divider:after{content:"";position:absolute;width:18px;height:18px;background:#fbf4ee;border:1px solid #ead5d5;border-radius:50%;top:-10px}.divider:before{left:-10px}.divider:after{right:-10px}.bottom{font-size:12px;color:#ae868b;letter-spacing:2px}.progress{display:flex;align-items:center;gap:12px;font-size:12px;color:#ac838a;margin:0 5px 22px}.track{height:4px;flex:1;background:#ecdcdd;border-radius:5px;overflow:hidden}.bar{height:100%;width:0;background:#c47a8b;transition:width .2s}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.primary{border:0;border-radius:30px;color:#fff9f7;background:#ac596f;padding:16px 22px;width:100%;font-size:15px;letter-spacing:1px;box-shadow:0 6px 16px #ac596f23}.primary:active{transform:scale(.98)}.plain{border:0;background:none;color:#aa7f86;padding:15px;font-size:12px}.footer{margin-top:22px;color:#b49396;font-size:12px;line-height:1.8}button:focus-visible,canvas:focus-visible{outline:3px solid #824051;outline-offset:4px}.confetti{position:fixed;pointer-events:none;color:#c65f80;z-index:9;font-size:22px;animation:float 1.8s ease-out forwards}@keyframes float{to{transform:translate(var(--dx),-240px) rotate(40deg);opacity:0}}[hidden]{display:none!important}@media(max-height:720px){main{padding-top:24px}.seal{margin:14px auto 10px;width:44px;height:44px;font-size:25px}h1{font-size:29px}.ticket{margin:23px 0 17px}.field{height:225px}.footer{margin-top:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><main><div class="eyebrow">LOVE NOTE · 只给你</div><div class="seal" aria-hidden="true">♡</div><h1>强强宝宝，<br>有句悄悄话想告诉你。</h1><p class="sub">藏在这里的喜欢，<br>要你亲手刮开才算数。</p><article class="ticket"><div class="topline"><span class="to">TO：强强宝宝</span><span id="number">NO. 01</span></div><div class="field" id="field"><div class="inside" id="inside" aria-hidden="true"><div class="little" aria-hidden="true">💌</div><p class="quote" id="quote"></p><div class="sign">来自 · 最想你的人</div></div><canvas id="cover" tabindex="0" role="button" aria-label="用手指刮开悄悄话，也可以按回车揭晓"></canvas></div><div class="divider"></div><div class="bottom">专属偏爱 · 每张都有喜欢</div></article><div class="progress"><span id="status" aria-live="polite">用手指慢慢刮开</span><div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div><span id="percent">0%</span></div><button class="primary" id="next" hidden>再抽一张悄悄话 ♡</button><button class="plain" id="reveal">不方便刮？点这里揭晓</button><p class="footer">不用兑换，不会过期。<br>我的喜欢，一直对你有效。</p></main><script>
const $=id=>document.getElementById(id),canvas=$('cover'),ctx=canvas.getContext('2d');
const notes=['人间那么大，\n我偏偏最想\n待在你身边。','想把普通的一天，\n和你一起过成\n舍不得结束的一天。','强强宝宝，\n今天的喜欢已送达。\n明天还有哦。','有时候没有什么事，\n就是忽然很想\n抱抱你。','你不用一直很厉害。\n在我这里，\n也可以做个宝宝。','想和你分享的，\n不只是好看的风景，\n还有每天的小事情。','今天也想认真告诉你：\n被你喜欢，\n是一件很开心的事。','下次见面，\n先抱一会儿。\n话可以慢慢说。','如果今天有点累，\n就把烦恼放一放。\n我陪你歇一会儿。','想你的时候，\n连发呆\n都有了具体的方向。','见到好吃的想起你，\n遇到好玩的想起你。\n原来日常里都是你。','好好吃饭，好好睡觉。\n还要记得，\n有人在偷偷想你。','和你并排走的时候，\n我总希望\n这条路再长一点。','我喜欢的浪漫是，\n抬头看你，\n你也刚好看向我。','今天没什么大事，\n只是又比昨天\n多喜欢你一点。','强强宝宝，爱你哦。\n这句是真的，\n每次都是真的。'];
let bag=[],last=-1,round=0,revealed=false,drawing=false,previous=null,w=0,h=0,lastCheck=0;
function drawNote(){if(!bag.length){bag=notes.map((_,i)=>i);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}if(bag[bag.length-1]===last)[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}last=bag.pop();return notes[last]}
function paint(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;const d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);ctx.globalCompositeOperation='source-over';const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#c994a2');g.addColorStop(.5,'#e3bcc4');g.addColorStop(1,'#bc8395');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff5f52b';for(let x=15;x<w;x+=29)for(let y=15;y<h;y+=29){ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill()}ctx.textAlign='center';ctx.fillStyle='#fffafa';ctx.font='42px Georgia';ctx.fillText('♡',w/2,h/2-24);ctx.font='600 18px sans-serif';ctx.fillText('刮开，看看我有多喜欢你',w/2,h/2+15);ctx.font='12px sans-serif';ctx.fillText('SCRATCH FOR A LITTLE LOVE',w/2,h/2+43)}
function sparkle(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<18;i++){const e=document.createElement('span');e.className='confetti';e.textContent=i%3?'♡':'✦';e.style.left=(20+Math.random()*60)+'vw';e.style.top=(45+Math.random()*25)+'vh';e.style.setProperty('--dx',(Math.random()*180-90)+'px');document.body.append(e);setTimeout(()=>e.remove(),1900)}}
function reveal(){if(revealed)return;revealed=true;drawing=false;previous=null;$('field').classList.add('revealed');$('inside').removeAttribute('aria-hidden');canvas.tabIndex=-1;canvas.setAttribute('aria-hidden','true');$('bar').style.width='100%';$('percent').textContent='100%';$('status').textContent='悄悄话已揭晓';$('next').hidden=false;$('reveal').hidden=true;sparkle()}
function progress(){const a=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;for(let i=3;i<a.length;i+=64){total++;if(a[i]<128)clear++}const p=Math.min(100,Math.round(clear/total*100));$('bar').style.width=p+'%';$('percent').textContent=p+'%';if(p>=40)reveal()}
function scratch(e){const r=canvas.getBoundingClientRect();const p={x:e.clientX-r.left,y:e.clientY-r.top};ctx.globalCompositeOperation='destination-out';ctx.lineWidth=46;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(previous?previous.x:p.x,previous?previous.y:p.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,23,0,Math.PI*2);ctx.fill();previous=p;if(performance.now()-lastCheck>180){progress();lastCheck=performance.now()}}
canvas.addEventListener('pointerdown',e=>{if(revealed||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();drawing=true;previous=null;canvas.setPointerCapture(e.pointerId);scratch(e)});canvas.addEventListener('pointermove',e=>{if(drawing&&!revealed)scratch(e)});function stop(){if(drawing){drawing=false;previous=null;progress()}}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('lostpointercapture',stop);canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}});
function next(){revealed=false;drawing=false;previous=null;round++;$('quote').textContent=drawNote();$('inside').setAttribute('aria-hidden','true');canvas.removeAttribute('aria-hidden');canvas.tabIndex=0;$('field').classList.remove('revealed');$('number').textContent='NO. '+String(round).padStart(2,'0');$('status').textContent='用手指慢慢刮开';$('percent').textContent='0%';$('bar').style.width='0%';$('next').hidden=true;$('reveal').hidden=false;paint()}
$('reveal').onclick=reveal;$('next').onclick=()=>{next();canvas.focus({preventScroll:true})};new ResizeObserver(()=>{const r=canvas.getBoundingClientRect();if(Math.abs(r.width-w)<1&&Math.abs(r.height-h)<1)return;const saved=document.createElement('canvas');saved.width=canvas.width;saved.height=canvas.height;saved.getContext('2d').drawImage(canvas,0,0);paint();ctx.clearRect(0,0,w,h);ctx.drawImage(saved,0,0,w,h)}).observe($('field'));next();
</script></body></html>
