<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f0e6"><title>强强宝宝，过来抱一下 🧸</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f0e6;color:#594637;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100svh;background-image:radial-gradient(#bda78b25 1px,transparent 1px);background-size:16px 16px}main{max-width:440px;margin:auto;padding:32px 25px;text-align:center}.top{display:flex;justify-content:space-between;color:#9a866e;font-size:11px;letter-spacing:2px}.pill{background:#e5eadc;color:#768464;padding:5px 10px;border-radius:20px;font-size:10px;letter-spacing:1px}.head{margin:32px 0 9px;font-size:33px;line-height:1.45;font-family:"Songti SC",serif;font-weight:600}.sub{color:#9a8675;line-height:1.9;font-size:14px;margin:0}.station{position:relative;margin:24px 0 18px;padding:23px 20px 25px;border-radius:120px 120px 25px 25px;border:1px solid #eadac6;background:linear-gradient(#fffcf5,#fff8ec);box-shadow:0 16px 40px #8c6d4610}.art{height:210px;display:grid;place-items:center;position:relative}.halo{position:absolute;width:190px;height:190px;border-radius:50%;background:#f0e4cc;transition:background .4s,transform .4s}.charging .halo{background:#f8dcbc;transform:scale(1.08)}svg{width:220px;height:205px;z-index:1;overflow:visible}.arm{transform-box:fill-box;transform-origin:center;transition:transform .5s}.charging .left,.complete .left{transform:translateX(12px) rotate(15deg)}.charging .right,.complete .right{transform:translateX(-12px) rotate(-15deg)}.heart{transform-origin:110px 140px;transition:transform .5s}.complete .heart{transform:scale(1.2)}.meter-head{display:flex;justify-content:space-between;font-size:12px;color:#9b7c5d;margin:12px 0}.track{height:10px;background:#eee5d8;border-radius:12px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#d4b581,#cb7f6f);border-radius:12px}.status{margin:13px 0 0;min-height:20px;font-size:12px;color:#a68b70}.hold{width:100%;border:0;border-radius:20px;padding:19px 12px;font:600 16px inherit;font-family:inherit;font-size:16px;font-weight:600;background:#8a9a79;color:white;box-shadow:0 5px 0 #6e805d;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}.hold:active{transform:translateY(3px);box-shadow:0 2px 0 #6e805d}.hold:disabled{background:#b39476;box-shadow:none;cursor:default}.plain{font:inherit;background:transparent;border:0;color:#a08a75;font-size:12px;padding:17px 10px;cursor:pointer}.letter{margin:19px 0 0;padding:24px 18px;background:#fffdf8;border:1px solid #e5d4be;border-radius:18px;animation:arrive .55s ease-out}.small{color:#b38b70;font-size:11px;letter-spacing:3px}.message{font-family:"Songti SC",serif;font-size:21px;line-height:1.85;margin:15px 0}.sign{font-size:12px;line-height:1.8;color:#a38a78}.footer{font-size:11px;color:#b09b88;margin:25px 0 0;line-height:1.9}.spark{position:fixed;pointer-events:none;font-size:22px;color:#c98076;animation:fly 1.7s ease-out forwards;z-index:9}@keyframes fly{to{transform:translate(var(--x),-180px) rotate(30deg);opacity:0}}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}button:focus-visible{outline:3px solid #785c45;outline-offset:4px}[hidden]{display:none!important}@media(max-height:750px){main{padding-top:22px}.head{margin-top:22px;font-size:29px}.station{margin-top:18px;padding-top:10px}.art{height:185px}.halo{width:170px;height:170px}svg{height:185px}.footer{margin-top:15px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><div class="top"><span>今日份偏爱 · 09.24</span><span class="pill">只为你开放</span></div><h1 class="head">强强宝宝，<br>过来抱一下。</h1><p class="sub">有个小小的抱抱，正在等你签收。<br>按住下面的按钮，把它慢慢充满。</p><section class="station" id="station"><div class="art"><div class="halo"></div><svg viewBox="0 0 220 205" role="img" aria-label="抱着爱心等你的小熊"><circle cx="64" cy="47" r="23" fill="#bd936a"/><circle cx="156" cy="47" r="23" fill="#bd936a"/><circle cx="64" cy="47" r="12" fill="#e8c9a5"/><circle cx="156" cy="47" r="12" fill="#e8c9a5"/><ellipse cx="110" cy="155" rx="62" ry="49" fill="#c9a47d"/><ellipse cx="110" cy="88" rx="63" ry="55" fill="#d5b38d"/><ellipse cx="110" cy="109" rx="28" ry="23" fill="#f1ddbf"/><circle cx="86" cy="86" r="4.5" fill="#624936"/><circle cx="134" cy="86" r="4.5" fill="#624936"/><ellipse cx="110" cy="101" rx="8" ry="6" fill="#624936"/><path d="M110 106v8m0 0q-8 7-14 0m14 0q8 7 14 0" fill="none" stroke="#624936" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="74" cy="101" rx="10" ry="5" fill="#d69484" opacity=".65"/><ellipse cx="146" cy="101" rx="10" ry="5" fill="#d69484" opacity=".65"/><path class="heart" d="M110 179C56 151 78 118 110 140C142 118 164 151 110 179Z" fill="#c97876"/><ellipse class="arm left" cx="67" cy="158" rx="17" ry="30" fill="#bd936a" transform="rotate(-30 67 158)"/><ellipse class="arm right" cx="153" cy="158" rx="17" ry="30" fill="#bd936a" transform="rotate(30 153 158)"/></svg></div><div class="meter-head"><span>抱抱能量</span><span id="percent">0%</span></div><div class="track" role="progressbar" aria-label="抱抱能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><div class="fill" id="fill"></div></div><p class="status" id="status" aria-live="polite">留一点时间，给一个长长的抱抱。</p></section><button class="hold" id="hold">按住 3 秒，接住我的抱抱</button><button class="plain" id="tap">不方便长按？点一下也能充电</button><section class="letter" id="letter" hidden aria-live="polite"><span class="small">你的专属抱抱 · 已送达</span><p class="message">今天不用一直很厉害。<br>累了就靠过来，<br>我想抱着你歇一会儿。</p><p class="sign">强强宝宝，爱你哦。<br>隔着屏幕的这一个，下次见面补给你。</p><button class="plain" id="again">还想再抱一下 ♡</button></section><p class="footer">松手也没关系，喜欢不会清零。<br>今天、明天，都有你的抱抱。</p></main><script>
const $=id=>document.getElementById(id);let energy=0,holding=false,done=false,last=0,frame=0,pointer=null;
function paint(){$('fill').style.width=energy+'%';$('percent').textContent=Math.floor(energy)+'%';$('meter').setAttribute('aria-valuenow',Math.floor(energy))}
function stop(){holding=false;pointer=null;cancelAnimationFrame(frame);$('station').classList.remove('charging');if(!done&&energy>0)$('status').textContent='已经存好啦，想抱的时候再继续。'}
function finish(){if(done)return;done=true;energy=100;stop();paint();$('station').classList.add('complete');$('status').textContent='抱抱已充满，现在可以安心靠过来。';$('hold').textContent='抱到了！先不松手 🧸';$('hold').disabled=true;$('tap').hidden=true;$('letter').hidden=false;if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<15;i++){const e=document.createElement('span');e.className='spark';e.textContent=i%3?'♡':'✦';e.style.left=(25+Math.random()*50)+'vw';e.style.top=(40+Math.random()*30)+'vh';e.style.setProperty('--x',(Math.random()*140-70)+'px');document.body.append(e);setTimeout(()=>e.remove(),1800)}}}
function add(n){if(done)return;energy=Math.min(100,energy+n);paint();if(energy>=100)finish()}
function tick(t){if(!holding||done)return;add(Math.max(0,t-last)/30);last=t;if(!done)frame=requestAnimationFrame(tick)}
function start(){if(done||holding)return;holding=true;last=performance.now();$('station').classList.add('charging');$('status').textContent='正在靠近你……再抱一小会儿。';frame=requestAnimationFrame(tick)}
$('hold').addEventListener('pointerdown',e=>{if(done||pointer!==null||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();pointer=e.pointerId;$('hold').setPointerCapture(pointer);start()});for(const type of ['pointerup','pointercancel','lostpointercapture'])$('hold').addEventListener(type,stop);$('hold').addEventListener('contextmenu',e=>e.preventDefault());$('hold').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();start()}});$('hold').addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();stop()}});$('hold').addEventListener('blur',stop);window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});$('tap').onclick=()=>{add(20);if(!done)$('status').textContent='又靠近一点，再点一下也可以。'};$('again').onclick=()=>{stop();energy=0;done=false;paint();$('station').classList.remove('complete');$('letter').hidden=true;$('hold').disabled=false;$('hold').textContent='按住 3 秒，接住我的抱抱';$('tap').hidden=false;$('status').textContent='好呀，再抱久一点。';$('hold').focus({preventScroll:true});$('station').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'})};
</script></body></html>
