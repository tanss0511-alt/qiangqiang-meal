你的辛苦，我有放在心上。</p></section><p class="progress" id="progress">心里话 · 0 / 3</p><button class="hug" id="hug" hidden>收下一个隔空拥抱 ♡</button><section class="letter" id="letter" hidden aria-live="polite"><div class="embrace" aria-hidden="true">🫂</div><h2>来，抱抱我的强强宝宝。</h2><p>今天没在你身边，<br>没法帮你擦汗，也没法真的抱住你。<br>但我一直惦记着你。</p><p>帽子把脸遮住了也没关系，<br>我知道，下面是我很喜欢的人。<br>今天辛苦啦，先休息一会儿。<br>等见面，我再把这个拥抱补给你。</p><p>树慢慢长，我们也慢慢来。<br>爱你哦。♡</p><button class="again" id="again">再抱一下</button></section><button class="again" id="reset" hidden>把心里话再看一遍</button><div class="audio-status" id="audio-status" role="status"></div><footer>你照顾果树，也要照顾好自己。</footer></main><audio id="music" src="data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjcuMTAwAAAAAAAAAAAAAAD/84DAAAAAAAAAAAAASW5mbwAAAA8AAAK0AAI1tQADBQgKDQ8SFRgaHR8hJCYpKy4xNDY5Oz5AQkVISk1QUlVXWlxfYWRnaWxucXN2eHt9gIOFiIqNj5KUl5qcn6GkpqmrrrCztrm7vsDCxcfKzc/S1dfa3N/h4+bp7O7x8/b4+/0AAAAATGF2YzYxLjE5AAAAAAAAAAAAAAAAJARRAAAAAAACNbWBOIrFAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//OAxAApgS3sAVzAADlMBNXjMysxjh00OcSA3gsjOhMMoIw3NDj0+nPS4c63KTea7M+jshFBkotGXisZKGBi8JkwDMABYxILDFQgDA4FQWYVC5hECg4hdwtog4mIqRdi7GILHXezty3ff9/3/h9/H8hyMRiMUlJSU9PT09PT09PbpLGGGGGGGFPbzB8HwfBAEAQBCJwfB94Y/wQd/BDgmD7//g+D4P/wfB95flwQDH/wcBAwAAKoMHtC9zCbQN00QsarMLHNGTXTQUIwHgHCMv/zgsQdLjC6GAGf8ABmBroxm0W1Mx5NFTKeBhgwvBLeMFgAWjADQAowfMC6MCMAIzCGAT8wQEAYMKgagxagNgaACYsInpkRANhwK5jUsUmBSF+YBYC3009rPXPxw7zDuP/y5cCggE4bcByBQG4sJQVSDLLzryCRwtIQa3bdKya3KSHjqVHK1mWHkgw5QgULvRQ9LLTjksFRe81JJbyzEHJld24iGGkYMEEgdmBkA7ZhfQomZB4VCnTVS4Bi5Yt4YomHlGMzhcRjZAamYiWEBmFZ//OCxCgys74ME99AALH0d6IVZmNKBrZhUwRaYLIBNhYA8MA3AZzALwHUwKYBDMBaBAzBdAQEy1AcIMH/BbDAuwDgeACgAAHkQAKuoORQAwqLGlTd9oxkxKsN++0V4k6eXaoaE8b8/38z1F83crHWv96c81a21X3b/pxY2e/uPdL1/54a0SG5zV4nuEqubrvtb5bj4np/T+94uufri9P6hv03e7TWk+uh/KPvJkhLHj0TVV+YCOA/GAcAj5gNYqIZU2xVmBqg2BgAQIeYE+PamAL/84LEISnJJhw0/4RtAIeYh2EsGG7nWhqRpnmYWKESGIEHeYQYQRglAmmCSEoAAB4ILKmAeCIbLJ/pgUgEKCu1KbWIpXXj1Lo2+U9ej15t6sdIJfc87/UpeO+F7vurazsfSdXXUPi7cw/Ab+3UOuc6Tk3pSkY7Ihc const notes=[['我很喜欢，你种出来的甜。','想到能吃到你亲手种的果树结出的果子，我就好开心。\n那里面有你的用心，也有让我忍不住想向别人炫耀的小骄傲。'],['你认真的样子，我好喜欢。','这么热的天，你戴着帽子，忙得大汗淋漓，还认真照顾着自己的果树。\n你的这份耐心和用心，我都看见了。强强宝宝，你真的很棒。'],['果树有人疼，你也有。','你在太阳底下照顾果树，我在远处心疼你。\n记得喝水，去阴凉处歇歇，不用一直硬撑。今天的你，值得一个大大的拥抱。']];
let picked=new Set(),muted=false,wanted=false,token=0;music.volume=.48;chime.volume=.35;
function ui(on){$('sound').textContent=on?'♫ 配乐已开启 · 关闭':'♫ 开启配乐';$('sound').setAttribute('aria-pressed',String(on))}
async function start(){if(muted||document.hidden)return;wanted=true;const t=++token;try{await music.play();if(t!==token)return;if(muted||document.hidden){music.pause();return}ui(true);$('audio-status').textContent='轻轻的音乐，陪你歇一会儿。'}catch(e){if(t!==token)return;wanted=false;ui(false);$('audio-status').textContent='没听见配乐？轻点上方「开启配乐」重试。'}}
function begin(){if(!wanted&&!muted)start()}
function ding(){if(!muted){chime.currentTime=0;chime.play().catch(()=>{$('audio-status').textContent='音效未播放，可点配乐按钮重试。'})}}
fruits.forEach((b,i)=>b.onclick=()=>{begin();picked.add(i);b.classList.add('picked');b.textContent='♡ 已摘';b.setAttribute('aria-label','重看第'+(i+1)+'颗果子的心里话');$('tag').textContent='心里话 · 0'+(i+1);$('heading').textContent=notes[i][0];$('message').textContent=notes[i][1];$('progress').textContent='心里话 · '+picked.size+' / 3';if(picked.size===3){$('hug').hidden=false;$('instruction').textContent='三颗果子都摘到了，还有一个拥抱给你。'}});
$('hug').onclick=()=>{begin();$('hug').hidden=true;$('letter').hidden=false;$('reset').hidden=false;ding();$('letter').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})};
$('again').onclick=()=>{begin();ding();$('again').textContent='再抱紧一点，今天辛苦啦 ♡'};
$('reset').onclick=()=>{picked.clear();fruits.forEach((b,i)=>{b.classList.remove('picked');b.textContent='摘一颗';b.setAttribute('aria-label','摘第'+(i+1)+'颗果子')});$('letter').hidden=true;$('hug').hidden=true;$('reset').hidden=true;$('again').textContent='再抱一下';$('tag').textContent='FOR YOU · 慢慢来';$('heading').textContent='这里有一小片阴凉';$('message').textContent='把手里的活放一放，喝口水。\n你的辛苦，我有放在心上。';$('progress').textContent='心里话 · 0 / 3';$('instruction').textContent='点点树上的三颗果子，里面藏着我的话。';fruits[0].focus()};
$('sound').onclick=()=>{if(wanted){muted=true;wanted=false;token++;music.pause();chime.pause();ui(false);$('audio-status').textContent='配乐已关闭。'}else{muted=false;start()}};
chime.addEventListener('ended',()=>{if(wanted&&!muted)start()});document.addEventListener('click',e=>{if(!e.target.closest('#sound'))begin()},true);document.addEventListener('WeixinJSBridgeReady',start,{once:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){token++;wanted=false;music.pause();chime.pause();ui(false);$('audio-status').textContent='回来后轻点页面，继续听。'}});start();
