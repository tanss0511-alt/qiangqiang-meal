</style></head><body><main><header class="top"><span>2026.09.27</span><span class="label">今日份偏爱 · 04</span></header><p class="eyebrow">一张合照的小秘密</p><h1>强强宝宝，<br>把我们拼在一起。</h1><p class="intro">先点一块，再点另一块，就能交换位置。<br>拼好这张照片，有句话想告诉你。</p><button class="sound" id="sound" aria-pressed="false">♫ 开启今天的配乐</button><section class="frame"><div class="board" id="board" aria-label="四块合照拼图"><button class="tile" data-position="1" aria-pressed="false"></button><button class="tile" data-position="2" aria-pressed="false"></button><button class="tile" data-position="3" aria-pressed="false"></button><button class="tile" data-position="4" aria-pressed="false"></button></div><p class="caption">想和你，出现在同一张照片里。</p></section><p class="progress" id="progress" aria-live="polite"></p><div class="track" aria-hidden="true"><span id="bar"></span></div><p class="status" id="status" role="status">点一块照片，再点另一块，交换一下试试。</p><div class="actions"><button id="hint">给我一点提示</button><button id="reset">重新打乱 ↻</button></div><section class="letter" id="letter" hidden><span class="heart">♡</span><h2>拼好啦。还是我们最般配。</h2><p>强强宝宝，<br>今天也想站在你身边，<br>把一点开心、一点小事，<br>都慢慢讲给你听。</p><p>以后还想和你拍好多合照。<br>笑得好看也好，表情奇怪也好，<br>只要是我们，我都想留下。</p><p class="signature">今日份喜欢，已经拼完整啦。爱你哦。</p></section><p class="audio-status" id="audio-status">配乐会尝试自动响起；微信里轻点照片，也能开启。</p><p class="footer">不用赶时间，慢慢来。<br>我一直在照片的另一半等你。</p><details><summary>备用音乐播放器</summary><audio id="music" autoplay controls loop playsinline preload="auto" src="data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjcuMTAwAAAAAAAAAAAAAAD/84DAAAAAAAAAAAAASW5mbwAAAA8AAAK0AAI1tQADBQgKDQ8SFRgaHR8hJCYpKy4xNDY5Oz5AQkVISk1QUlVXWlxfYWRnaWxucXN2eHt9gIOFiIqNj5KUl5qcn6GkpqmrrrCztrm7vsDCxcfKzc/S1dfa3N/h4+bp7O7x8/b4+/0AAAAATGF2YzYxLjE5AAAAAAAAAAAAAAAAJARRAAAAAAACNbWBOIrFAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//OAxAApgS3sAVzAADlMBNXjMysxjh00OcSA3gsjOhMMoIw3NDj0+nPS4c63KTea7M+jshFBkotGXisZKGBi8JkwDMABYxILDFQgDA4FQWYVC5hECg4hdwtog4mIqRdi7GILHXezty3ff9/3/h9/H8hyMRiMUlJSU9PT09PT09PbpLGG let pieces=[2,0,3,1],chosen=-1,done=false,moves=0,wanted=false,muted=false,request=0;
const music=$('music'),chime=$('chime');music.volume=.6;chime.volume=.4;
function soundUI(on){$('sound').textContent=on?'♫ 配乐已开启 · 关闭':'♫ 开启今天的配乐';$('sound').setAttribute('aria-pressed',String(on))}
async function playMusic(){wanted=true;const token=++request;try{await music.play();if(token!==request||document.hidden||!wanted){if(document.hidden||!wanted)music.pause();return}soundUI(true);$('audio-status').textContent='轻轻的音乐，陪你把我们拼在一起。'}catch(e){if(token!==request)return;wanted=false;soundUI(false);$('audio-status').textContent='配乐还没响起，轻点音乐按钮重试。'}}
function begin(){if(!muted&&!wanted)playMusic()}
function draw(){let correct=0;tiles.forEach((b,i)=>{b.style.backgroundImage='url("'+photo+'")';b.style.backgroundPosition=(pieces[i]%2*100)+'% '+(Math.floor(pieces[i]/2)*100)+'%';b.setAttribute('aria-label','第'+(i+1)+'个位置，'+(i===chosen?'已选中，再点另一块交换':'点选照片块'));b.setAttribute('aria-pressed',String(i===chosen));b.classList.remove('hint');if(pieces[i]===i)correct++});$('progress').textContent='已拼好 '+correct+' / 4 块 · 交换了 '+moves+' 次';$('bar').style.width=correct*25+'%'}
function complete(){done=true;chosen=-1;draw();$('board').classList.add('solved');$('letter').hidden=false;$('hint').disabled=true;$('status').textContent='合照拼好啦！往下看，收下我的悄悄话。';if(!muted){chime.currentTime=0;chime.play().catch(()=>{})}$('letter').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'})}
tiles.forEach((b,i)=>b.onclick=()=>{begin();if(done)return;if(chosen===-1){chosen=i;$('status').textContent='已选第'+(i+1)+'块，再点另一块交换位置。';draw();return}if(chosen===i){chosen=-1;$('status').textContent='已取消选择，换一块试试。';draw();return}[pieces[chosen],pieces[i]]=[pieces[i],pieces[chosen]];chosen=-1;moves++;draw();if(pieces.every((p,j)=>p===j))complete();else $('status').textContent='越来越接近啦，再交换两块看看。'});
$('hint').onclick=()=>{begin();if(done)return;const i=pieces.findIndex((p,j)=>p!==j),j=pieces.indexOf(i);chosen=-1;draw();tiles[i].classList.add('hint');tiles[j].classList.add('hint');$('status').textContent='试着交换第'+(i+1)+'块和第'+(j+1)+'块，它们已经闪着提示啦。'};
$('reset').onclick=()=>{begin();chime.pause();pieces=[0,1,2,3];do{for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pieces[i],pieces[j]]=[pieces[j],pieces[i]]}}while(pieces.every((p,j)=>p===j));chosen=-1;moves=0;done=false;$('board').classList.remove('solved');$('letter').hidden=true;$('hint').disabled=false;$('status').textContent='再拼一次，这回也想和你站在一起。';draw()};
$('sound').onclick=()=>{if(wanted){wanted=false;muted=true;request++;music.pause();chime.pause();soundUI(false)}else{muted=false;playMusic()}};
chime.addEventListener('ended',()=>{if(wanted&&!document.hidden)playMusic()});
document.addEventListener('click',e=>{if(!e.target.closest('#sound,audio'))begin()},true);document.addEventListener('WeixinJSBridgeReady',()=>{if(!muted)playMusic()},{once:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){wanted=false;request++;music.pause();chime.pause();soundUI(false);$('audio-status').textContent='音乐已暂停，回来后点一下继续听。'}});
draw();playMusic();
