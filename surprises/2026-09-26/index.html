<main><header class="top"><span>2026.09.26 · SAT</span><span class="badge">仅限我们两个人</span></header><p class="eyebrow">两个人的小小出逃</p><h1>强强宝宝，<br>把周末留一小格给我。</h1><p class="intro">今天不赶路，也不赶时间。<br>选一张票，看看我想和你去哪儿。</p><button class="sound" id="sound" aria-pressed="false">♫ 开启约会配乐</button><section class="machine" aria-label="选择约会票"><div class="display" id="display" role="status">请选择一张 · 双人票</div><div class="choices"><button class="choice" aria-pressed="false" data-ticket="0"><span class="icon">🍃</span><small>吹吹风</small></button><button class="choice" aria-pressed="false" data-ticket="1"><span class="icon">🌇</span><small>等日落</small></button><button class="choice" aria-pressed="false" data-ticket="2"><span class="icon">🛋️</span><small>窝一起</small></button></div><div class="slot"></div></section><p class="note" id="note">选票 → 撕开票根 → 收到我的邀请</p><section class="ticket" id="ticket" hidden aria-label="你的约会票"><div class="ticket-head"><span>TO：强强宝宝</span><span id="serial"></span></div><div class="ticket-body"><p style="font-size:11px;letter-spacing:3px;color:#ab9273">目的地暂时保密</p><div class="motion" id="motion" hidden><div class="memory-stage"><img id="memory-still" alt="先看一张我们的回忆照片"><video id="memory-video" muted loop playsinline webkit-playsinline controls preload="none" aria-label="我们生活里的动态回忆"></video></div><button id="video-retry" type="button">▶ 播放动态回忆</button><p id="video-status" role="status">一小段生活，也想和你再看一次。</p></div><figure class="memory-photo" id="photo-frame" hidden><img id="ticket-photo" alt="我们一起留下的合照"><figcaption>和你一起的时刻，想再多一点。</figcaption></figure><h2 id="title">有个地方，想和你去。</h2><p class="secret" id="message">这张票藏着我的一点小心思。<br>撕开下面的票根，才告诉你。</p><div class="seal" id="seal" hidden>偏爱专席<br>已为你预留</div></div><button class="tear" id="tear">沿虚线轻点，撕开我的小心思 ↓</button><div class="ticket-foot" id="ticket-foot" hidden>同行人：我 ♡ 你<br>有效期：等我们都有空的那一天</div></section><button class="reset" id="reset" hidden>换一张票，还有别的小心思 ↻</button><p class="status" id="audio-status" role="status">正在为你开启配乐；微信若拦截，轻触页面就会接上。</p><p class="footer">不用去很远的地方。<br>只要身边是你，就算约会。</p><details><summary style="font-size:11px;color:#96856f;text-align:center">备用音乐播放器</summary><audio id="music" autoplay controls loop preload="auto" playsinline style="width:100%;margin-top:10px" src="data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjcuMTAwAAAAAAAAAAAAAAD/84DAAAAAAAAAAAAASW5mbwAAAA8AAAMAAAJzwAACBQgKDRASFBcaHB8hJCYpLC4wMzY4Oz5AQkVISk1QUlRXWlxfYWRmaWxucHN2eHt+gIKFiIqNkJKUl5qcn6GkpqmsrrCztri7vsDCxcjKzdDS1Nfa3N/h5Obp7O7w8/b4+/4AAAAATGF2YzYxLjE5AAAAAAAAAAAAAAAAJAMYAAAAAAACc8C+Co6OAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//OAxAAk6PH8DVx4AAi8bjYZoUUmMD8aoWhqA3GHhOZnPZlMTG1pYfx+Z9XCnHVSYvFxnJIGlkQZuJg0RDC4pMoFAyYPjFAOSNMEg8weCwED0AaRYKgJAJoPQTgnBoGgdB1oeh6Hq9Xq9Xs6sVjx48ePHjx+/fv39wfBwEAQBAEAfB8HwfBwEAxv8Mf/+UBAEAw70/5R3qBD/+H+D5/+oMIwEQRyMNvFdTENwjE3Fcm1MUVWHzmiwsYwdAV6M39DyTLFRAU0VkP6MP+g/THBB//zgsQvM1muEAGfsAEoMGJATgKCUmAhgOBhzBBsYVUAJmKvhhwGaQT4GAIAgXRA7dpXAxHg2AaBKB3ZXsBEKYDwCGg5xbLabEuUSTTMZroIlc8bn1H90nRSRZ3LzMuyVF9mQTmCB5akLXo2TdbPSfTdSZwJxayLHuiYOO9VaQj+qGRIUrW8NqL+ge+0B2feetsK+6tj3t8V02n/1Jb8Quo+MSYDpM0QKoM24vV3zA6gdUwqQTlMgyKETeVGxQxlcYIMSBCqDESQq0yboYZNIWe1//OCxCUvQUoYC99gAEy0QKrMDNAfDBkgO0wGYAbMAcACTACwEIBAU5gRgfEZlgFrmD4gowGCQhYAOMAmAMwMAWs0AoAAmtBoJB8vHERVJ0TlUBkfXOT11o6ri57WXestrlntqt6rtYLX2tbs17LWmrQlOhl4dDBgGhR62pUlbWFiJIYSsaLziSWZZI74dXQpbiwkVtQrK0zaCcD2e3cHVHG2PfZvMCfA9jAjggkwOslKNKLrQTB0QvwwPYITMMFSWTG0hXQwhzqyNzFNszgyFDH/84LELCpAigwA/7pJaggzB7BqMEIGMwFwihEJuYEsuxp/uvmQZ+nJY3GRwUmHYGAIMQwDk1WbSCgmbm/ua6etncO+yJ+73my57HEoDK8fjber2wxo7htft3XhexQ12ynsbLIBJrPuo/b/oz+Ip/Wt9fW7jHiX5bKu3u3NPvPt1lkc/mfIuLrcNvy7zAIgJMwD4GAMFTHSzS65GowkMIHMA2AxzC4DikxO0TdNlXnfzDVx2IwoII7MD5AlDAogG0wDkBMBICCYDsAiGEFgVhoT4P/zgsRHK6lmEAr/BqWsHtGKaRZBiYjmCQ0CAKhkwF2rpidSHS03z23pXLVbY1fz2LpLlSyhlub9/QHXnfhXPygf7nMb/f/BYZ1+v7H0p/5Otot+m14bTpfT43K4C4vZ+P/dCtVGNHvd25e/3s1wz+muuxdROjARgEYwPcEvMLcF0DpTH7cxRIIEMJHA8zGAApwzCMEvOYwMzDpQgjByLRhyCOmDuDIYKAApgmgimDQIUYe8SJqcuEGJMFMY/QBIGDuDAWRYBpC1ZzZoHlda let videoToken=0;const videoCache=new Map();
function stopVideo(){videoToken++;$('memory-video').pause();$('video-retry').disabled=false}
async function showVideo(i){stopVideo();const token=videoToken;const v=$('memory-video');v.removeAttribute('src');v.load();v.poster=videoPosters[i];v.muted=true;const still=$('memory-still');still.src=videoPosters[i];still.hidden=false;const photoPause=(still.decode?still.decode().catch(()=>{}):Promise.resolve()).then(()=>new Promise(resolve=>setTimeout(resolve,2000)));$('video-retry').disabled=true;$('motion').hidden=false;$('video-status').textContent='先把这一刻留住，等一下，让回忆动起来。';$('video-retry').textContent='照片停留中 · 即将播放';try{if(!videoCache.has(i))videoCache.set(i,fetch('video-'+i+'.json').then(r=>{if(!r.ok)throw Error();return r.json()}).catch(e=>{videoCache.delete(i);throw e}));const [data]=await Promise.all([videoCache.get(i),photoPause]);if(token!==videoToken||document.hidden)return;v.src=data.src;try{await v.play();if(token!==videoToken)return;if(document.hidden){v.pause();return}still.hidden=true;$('video-retry').disabled=false;$('video-status').textContent='动态回忆 · 静音循环，不打断配乐';$('video-retry').textContent='Ⅱ 暂停动态回忆'}catch(e){if(token!==videoToken)return;$('video-retry').disabled=false;$('video-status').textContent='轻点播放，看看会动的回忆。';$('video-retry').textContent='▶ 播放动态回忆'}}catch(e){if(token!==videoToken)return;$('video-retry').disabled=false;$('video-status').textContent='视频还没加载好，照片可以先看，点这里重试。';$('video-retry').textContent='↻ 重试动态回忆'}}
let selected=-1,revealed=false,wanted=false,muted=false,playToken=0;const music=$('music'),effect=$('effect');music.volume=.55;effect.volume=.45;
function ui(on){$('sound').textContent=on?'♫ 配乐已开启 · 点此关闭':'♫ 开启约会配乐';$('sound').setAttribute('aria-pressed',String(on))}
async function playMusic(){wanted=true;const t=++playToken;try{await music.play();if(t!==playToken||document.hidden||!wanted){if(!wanted||document.hidden)music.pause();return}ui(true);$('audio-status').textContent='轻轻的音乐，陪你拆一张约会票。'}catch(e){if(t!==playToken)return;wanted=false;ui(false);$('audio-status').textContent='轻触页面就能开启配乐，也可以点上方音乐按钮重试。'}}
function begin(){if(!muted&&!wanted)playMusic()}
$('sound').onclick=()=>{if(wanted){muted=true;wanted=false;playToken++;music.pause();effect.pause();ui(false)}else{muted=false;playMusic()}};
choices.forEach((b,i)=>b.onclick=()=>{begin();stopVideo();$('motion').hidden=true;selected=i;revealed=false;$('photo-frame').hidden=true;choices.forEach((c,j)=>c.setAttribute('aria-pressed',String(i===j)));$('display').textContent='出票成功 · 请撕开下方票根';$('serial').textContent='NO. 0520-0'+(i+1);$('title').textContent='有个地方，想和你去。';$('message').textContent='这张票藏着我的一点小心思。\n撕开下面的票根，才告诉你。';$('ticket').hidden=false;$('tear').hidden=false;$('seal').hidden=true;$('ticket-foot').hidden=true;$('reset').hidden=false;$('ticket').scrollIntoView({behavior:'smooth',block:'nearest'})});
$('tear').onclick=()=>{if(selected<0||revealed)return;revealed=true;begin();showVideo(selected);$('ticket-photo').src=photos[selected];$('photo-frame').hidden=false;$('title').textContent=invitations[selected][0];$('message').textContent=invitations[selected][1];$('tear').hidden=true;$('seal').hidden=false;$('ticket-foot').hidden=false;$('display').textContent='邀请已送达 · 想和你在一起';if(!muted){effect.currentTime=0;effect.play().catch(()=>{$('audio-status').textContent='小音效未播放，可继续看邀请或开启配乐。'})}if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<9;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%2?'♡':'✦';h.style.left=(15+Math.random()*70)+'vw';h.style.top=(55+Math.random()*25)+'vh';document.body.appendChild(h);setTimeout(()=>h.remove(),1700)}}};
effect.addEventListener('ended',()=>{if(wanted&&!document.hidden)playMusic()});
$('reset').onclick=()=>{effect.pause();stopVideo();$('motion').hidden=true;$('photo-frame').hidden=true;selected=-1;revealed=false;choices.forEach(b=>b.setAttribute('aria-pressed','false'));$('ticket').hidden=true;$('reset').hidden=true;$('display').textContent='请选择一张 · 双人票';choices[0].focus({preventScroll:true});choices[0].scrollIntoView({behavior:'smooth',block:'center'})};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopVideo();wanted=false;playToken++;music.pause();effect.pause();ui(false);$('audio-status').textContent='音乐已暂停，回来后点“开启约会配乐”继续。'}});
document.addEventListener('click',e=>{if(!e.target.closest('#sound,audio'))begin()},true);
document.addEventListener('touchend',e=>{if(!e.target.closest('#sound,audio'))begin()},{capture:true,passive:true});
document.addEventListener('WeixinJSBridgeReady',()=>{if(!muted)playMusic()},{once:true});
$('video-retry').onclick=()=>{const v=$('memory-video');if(!v.getAttribute('src')){if(selected>=0)showVideo(selected);return}if(!v.paused){v.pause();$('video-retry').textContent='▶ 播放动态回忆'}else v.play().then(()=>{$('memory-still').hidden=true;$('video-retry').textContent='Ⅱ 暂停动态回忆'}).catch(()=>{$('video-status').textContent='请点视频上的播放按钮重试。'})};
// Only the background music is attempted on entry; invitations and sound effects stay hidden until interaction.
playMusic();
</script></html>
