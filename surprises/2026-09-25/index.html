<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172339"><title>强强宝宝，月亮替我捎了封信 🌙</title><style>
*{box-sizing:border-box}body{margin:0;background:#172339;color:#fff2d6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100svh;background-image:radial-gradient(ellipse at 50% 35%,#31445c 0,transparent 65%)}main{max-width:460px;margin:auto;padding:30px 25px 35px;text-align:center}.top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#99a9bd}.stamp{border:1px solid #64758b;padding:4px 9px;border-radius:20px}.eyebrow{font-size:11px;letter-spacing:5px;color:#d1b87e;margin:35px 0 14px}h1{font-family:"Songti SC",serif;font-weight:500;font-size:34px;line-height:1.5;margin:0 0 10px}.sub{font-size:14px;line-height:1.9;color:#adbdcf;margin:0}.sky{height:295px;position:relative;margin:15px 0 0;border-bottom:1px solid #ffffff15}.moon{position:absolute;width:108px;height:108px;left:calc(50% - 54px);top:75px;border-radius:50%;background:#f5dda3;box-shadow:0 0 45px #f5dda323;overflow:hidden}.moon:after{content:"";position:absolute;background:#31445c;border-radius:50%;width:96px;height:96px;left:35px;top:-15px}.orbit{position:absolute;width:230px;height:230px;border:1px dashed #e0c89322;border-radius:50%;left:calc(50% - 115px);top:25px;transform:rotate(-20deg)}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.star{position:absolute;width:64px;height:64px;border:0;background:transparent;color:#8496b0;font-size:44px;line-height:1;transition:color .4s,filter .4s,transform .3s}.star span{display:block;font-size:10px;letter-spacing:2px;margin-top:6px;color:#b6c5d7}.star:nth-of-type(1){left:12%;top:25px}.star:nth-of-type(2){right:8%;top:98px}.star:nth-of-type(3){left:25%;top:185px}.star.on{color:#ffe1a0;filter:drop-shadow(0 0 12px #fbd79488);transform:scale(1.12)}.spark{position:absolute;font-size:12px;color:#8396b1;pointer-events:none}.a{left:8%;top:150px}.b{right:22%;top:25px}.c{right:20%;top:232px}.d{left:48%;top:5px}.status{min-height:45px;font-size:14px;color:#d5dfe9;line-height:1.8;margin:18px 0 8px}.count{font-size:11px;letter-spacing:3px;color:#92a6bf;margin:0 0 20px}.primary{width:100%;padding:16px 12px;border:1px solid #e7ce9c;border-radius:16px;background:#eed7aa;color:#394355;font-weight:600;font-size:15px}.primary:disabled{background:#243349;border-color:#465369;color:#98a8be;cursor:default}.letter{background:#fff5df;color:#655449;margin:23px 0 0;border-radius:5px 5px 20px 20px;text-align:left;padding:27px 24px;box-shadow:0 20px 50px #070d1733;position:relative;animation:arrive .6s ease}.letter:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(120deg,#ba7d77 0 12px,#fff5df 12px 24px,#779093 24px 36px,#fff5df 36px 48px)}.date{display:flex;justify-content:space-between;font-size:10px;color:#a89075;letter-spacing:1px}.letter h2{font-family:"Songti SC",serif;font-size:25px;font-weight:600;margin:23px 0 14px}.letter p{font-family:"Songti SC",serif;font-size:18px;line-height:2;margin:12px 0}.signature{text-align:right;color:#aa806c;font-size:13px!important}.plain{display:block;margin:18px auto 0;background:none;border:0;color:#bbcaDC;padding:12px;font-size:12px}.footer{margin:26px 0 0;font-size:11px;color:#8fa1b9;line-height:1.8}.glint{position:fixed;pointer-events:none;color:#ffe4ae;z-index:5;animation:fly 1.5s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),-150px) rotate(45deg);opacity:0}}@keyframes arrive{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}[hidden]{display:none!important}button:focus-visible{outline:3px solid #fff0c9;outline-offset:4px}@media(max-height:750px){main{padding-top:22px}.eyebrow{margin-top:22px}h1{font-size:29px}.sky{height:270px}.footer{margin-top:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><div class="top"><span>2026.09.25</span><span class="stamp">专属星际邮递</span></div><p class="eyebrow">MOON POST OFFICE</p><h1>强强宝宝，<br>月亮替我捎了封信。</h1><p class="sub">我把想说的话藏进了星光里。<br>点亮三颗星星，就能收到它。</p><section class="sky" aria-label="点亮三颗不同的星星"><div class="orbit" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div><i class="spark a" aria-hidden="true">✦</i><i class="spark b" aria-hidden="true">·</i><i class="spark c" aria-hidden="true">✧</i><i class="spark d" aria-hidden="true">·</i><button class="star" aria-label="点亮第一颗星：想你" aria-pressed="false">✦<span>想你</span></button><button class="star" aria-label="点亮第二颗星：偏爱" aria-pressed="false">✦<span>偏爱</span></button><button class="star" aria-label="点亮第三颗星：陪伴" aria-pressed="false">✦<span>陪伴</span></button></section><p class="status" id="status" aria-live="polite">随便选一颗，开始收集我的想念。</p><p class="count" id="count">星光已收集 · 0 / 3</p><button class="primary" id="open" disabled>信还在路上，先点亮星星吧</button><section class="letter" id="letter" hidden aria-live="polite"><div class="date"><span>TO：强强宝宝</span><span>月亮邮局 · 第 01 封</span></div><h2>今天也很想你。</h2><p>如果能把想念装进口袋，<br>你今天的口袋一定鼓鼓的。</p><p>想和你分享好吃的、好玩的，<br>也想和你一起，<br>把没什么特别的一天慢慢过完。</p><p>在见到你之前，<br>先让这三颗小星星陪着你。</p><p class="signature">强强宝宝，爱你哦。<br>—— 正在想你的我 ♡</p></section><button class="plain" id="again" hidden>把信收好，再看一次星星</button><p class="footer">宇宙这么大，我的信只寄给你。</p></main><script>
const $=id=>document.getElementById(id),stars=[...document.querySelectorAll('.star')],lit=new Set();let opened=false;const words=['第一份想念：今天遇到的小事，也想讲给你听。','这一颗藏着偏爱：看到可爱的东西，总会想到你。','最后留一份陪伴：你想说话的时候，我想好好听。'];
function glitter(button){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=button.getBoundingClientRect();for(let i=0;i<9;i++){const s=document.createElement('span');s.className='glint';s.textContent=i%2?'✦':'·';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',(Math.random()*140-70)+'px');document.body.append(s);setTimeout(()=>s.remove(),1550)}}
stars.forEach((b,i)=>b.addEventListener('click',()=>{if(lit.has(i))return;lit.add(i);b.classList.add('on');b.setAttribute('aria-pressed','true');$('count').textContent='星光已收集 · '+lit.size+' / 3';$('status').textContent=words[i];glitter(b);if(lit.size===3){$('open').disabled=false;$('open').textContent='拆开月亮寄来的信 💌';$('status').textContent='三颗星星都亮了。你的信，到了。'}}));
$('open').onclick=()=>{if(lit.size!==3||opened)return;opened=true;$('letter').hidden=false;$('open').hidden=true;$('again').hidden=false;$('status').textContent='强强宝宝专属来信 · 已送达';$('letter').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})};$('again').onclick=()=>{lit.clear();opened=false;stars.forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false')});$('letter').hidden=true;$('again').hidden=true;$('open').hidden=false;$('open').disabled=true;$('open').textContent='信还在路上，先点亮星星吧';$('status').textContent='星星重新藏好了，想念一直都在。';$('count').textContent='星光已收集 · 0 / 3';stars[0].focus({preventScroll:true});stars[0].scrollIntoView({behavior:'smooth',block:'center'})};
</script></body></html>
