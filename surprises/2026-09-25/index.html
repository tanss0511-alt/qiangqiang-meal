const $=id=>document.getElementById(id),stars=[...document.querySelectorAll('.star')],lit=new Set();let opened=false;const words=['第一份想念：今天遇到的小事，也想讲给你听。','这一颗是团圆：想和你分月饼，也想和你一起看月亮。','这一颗藏着偏爱：月饼分你一半，想念全部给你。'];
function glitter(button){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=button.getBoundingClientRect();for(let i=0;i<9;i++){const s=document.createElement('span');s.className='glint';s.textContent=i%2?'✦':'·';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',(Math.random()*140-70)+'px');document.body.append(s);setTimeout(()=>s.remove(),1550)}}
stars.forEach((b,i)=>b.addEventListener('click',()=>{startMusicOnce();if(lit.has(i))return;lit.add(i);b.classList.add('on');b.setAttribute('aria-pressed','true');$('count').textContent='星光已收集 · '+lit.size+' / 3';$('status').textContent=words[i];glitter(b);if(lit.size===3){$('open').disabled=false;$('open').textContent='拆开月亮寄来的信 💌';$('status').textContent='三颗星星都亮了。你的信，到了。'}}));
$('open').onclick=()=>{if(lit.size!==3||opened)return;opened=true;playVoice();$('letter').hidden=false;$('open').hidden=true;$('again').hidden=false;$('status').textContent='强强宝宝专属来信 · 已送达';$('letter').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})};$('again').onclick=()=>{stopVoice();$('voice-replay').hidden=true;lit.clear();opened=false;stars.forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false')});$('letter').hidden=true;$('again').hidden=true;$('open').hidden=false;$('open').disabled=true;$('open').textContent='信还在路上，先点亮星星吧';$('status').textContent='星星重新藏好了，想念一直都在。';$('count').textContent='星光已收集 · 0 / 3';stars[0].focus({preventScroll:true});stars[0].scrollIntoView({behavior:'smooth',block:'center'})};

const music=$('music'),voice=$('voice');let musicWanted=false,musicStarted=false,autoRetry=true,musicRequest=0,voiceRequest=0,voiceActive=false;
music.volume=.38;voice.volume=1;
function musicUI(playing){$('music-toggle').textContent=playing?'♫ 关闭配乐':'♫ 开启配乐';$('music-toggle').setAttribute('aria-pressed',String(playing))}
async function playMusic(){musicWanted=true;const token=++musicRequest;try{await music.play();if(token!==musicRequest||!musicWanted||document.hidden){if(!musicWanted||document.hidden)music.pause();return}autoRetry=false;musicUI(true);$('audio-hint').textContent='轻柔配乐陪你拆信，可以随时关闭。'}catch(e){if(token!==musicRequest)return;musicWanted=false;musicUI(false);$('music-toggle').textContent='♫ 点我重试配乐';$('audio-hint').textContent='轻触页面，月光配乐就会响起。'}}
function startMusicOnce(){if(autoRetry&&!document.hidden){autoRetry=false;musicStarted=true;playMusic()}}
function stopVoice(){voiceRequest++;voice.pause();voiceActive=false;music.volume=.38;$('voice-stop').hidden=true}
async function playVoice(){stopVoice();voice.currentTime=0;voiceActive=true;music.volume=.09;const token=++voiceRequest;$('voice-replay').hidden=false;$('voice-stop').hidden=false;try{await voice.play();if(token!==voiceRequest||document.hidden){if(!voiceActive||document.hidden)voice.pause();return}$('voice-replay').textContent='再听一次祝福';$('audio-hint').textContent='送给强强宝宝的中秋祝福。'}catch(e){if(token!==voiceRequest)return;stopVoice();$('voice-replay').textContent='点我重试女声祝福';$('audio-hint').textContent='祝福还没播放，点“重试女声祝福”即可。'}}
voice.addEventListener('ended',()=>{voiceActive=false;music.volume=.38;$('voice-stop').hidden=true});$('music-toggle').onclick=()=>{musicStarted=true;autoRetry=false;if(musicWanted){musicWanted=false;musicRequest++;music.pause();musicUI(false)}else playMusic()};$('voice-replay').onclick=playVoice;$('voice-stop').onclick=stopVoice;
document.addEventListener('visibilitychange',()=>{if(document.hidden){autoRetry=false;musicWanted=false;musicRequest++;music.pause();musicUI(false);stopVoice();$('audio-hint').textContent='声音已暂停，回来后可点按钮继续听。'}});
document.addEventListener('click',e=>{if(!e.target.closest('#music-toggle'))startMusicOnce()},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')startMusicOnce()},true);
playMusic();
</script></body></html>
